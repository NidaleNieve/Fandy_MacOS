name: Software verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 Scripts/check-change-scope.py --base "$BASE" --head "$HEAD"
  tests:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.outputs.app == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 25
    steps:
      - name: Require a valid change classification
        env:
          RESULT: ${{ needs.scope.result }}
          APP: ${{ needs.scope.outputs.app }}
        run: test "$RESULT" = success && { test "$APP" = true || test "$APP" = false; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: ${{ needs.scope.outputs.app == 'true' }}
        run: Scripts/verify.sh
      - name: Check documentation
        if: ${{ needs.scope.outputs.app == 'false' }}
        run: |
          python3 -m unittest discover -s Tests/ToolTests -p 'test_documentation.py' -v
          python3 -m unittest discover -s Tests/ToolTests -p 'test_change_scope.py' -v
          python3 Scripts/check-public-content.py --staged
  sanitizers:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.outputs.app == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - name: Require a valid change classification
        env:
          RESULT: ${{ needs.scope.result }}
          APP: ${{ needs.scope.outputs.app }}
        run: test "$RESULT" = success && { test "$APP" = true || test "$APP" = false; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: ${{ needs.scope.outputs.app == 'true' }}
        run: Scripts/verify.sh --sanitizers
      - name: Documentation-only change
        if: ${{ needs.scope.outputs.app == 'false' }}
        run: echo 'Sanitizers are not needed for documentation-only changes.'
  native-release:
    name: native-release (${{ matrix.os }})
    needs: scope
    if: ${{ always() }}
    strategy:
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ needs.scope.outputs.app == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Require a valid change classification
        env:
          RESULT: ${{ needs.scope.result }}
          APP: ${{ needs.scope.outputs.app }}
        run: test "$RESULT" = success && { test "$APP" = true || test "$APP" = false; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: ${{ needs.scope.outputs.app == 'true' }}
        run: python3 Scripts/generate-project.py
      - if: ${{ needs.scope.outputs.app == 'true' }}
        run: FANDY_BUILD_CONFIGURATION=Release Scripts/verify.sh --native-build
      - name: Documentation-only change
        if: ${{ needs.scope.outputs.app == 'false' }}
        run: echo 'Native builds are not needed for documentation-only changes.'
